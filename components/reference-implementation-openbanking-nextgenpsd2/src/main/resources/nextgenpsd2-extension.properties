# Configuration of the nextGenPSD2 extension endpoints.
#
# The values below are the defaults the reference implementation ships with. A deployment overrides them
# without rebuilding the web application, in this order of precedence:
#
#   1. a JVM system property of the same name, for example -Dsca.required=false
#   2. an environment variable of the same name in upper case with dots replaced by underscores,
#      for example SCA_REQUIRED=false
#   3. a properties file holding only the keys to override, pointed at by the system property
#      -Dnextgenpsd2.extension.config=<IS_HOME>/repository/conf/nextgenpsd2-extension.properties
#   4. this file

# --- Endpoints of the banking backend and the authorization server -------------------------------------

oauth.metadata.endpoint=https://localhost:8243/.well-known/openid-configuration
backend.base.url=http://localhost:9763/api/openbanking/nextgenpsd2/backend/services
accounts.shareable.path=/v130/accounts/shareable
accounts.payable.path=/v130/accounts/payable
payments.path=/payments

# --- Consent initiation --------------------------------------------------------------------------------

# Whether Strong Customer Authentication is required for a consent
sca.required=true
# The frequency per day an account consent may not go below
consent.frequency.per.day=4
# Whether the validity an account consent may request is capped
consent.valid.until.cap.enabled=false
# The number of days an account consent may be valid for when the cap is enabled
consent.valid.until.days=0
# The number of days into the future a payment may be scheduled for
payments.max.future.days=30
# The account reference types the bank accepts, in the order they are read from an account reference
accounts.supported.reference.types=iban,bban,maskedPan

# --- API versions of the nextGenPSD2 services ----------------------------------------------------------

api.version.ais=v1
api.version.pis=v1
api.version.piis=v2

# --- Consent access validation -------------------------------------------------------------------------
#
# The three settings below decide how strictly a data access request is validated. Each of them is off by
# default, which is what a deployment of the reference implementation against the declared extensions
# contract requires, and each of them lets a request through that a stricter deployment would reject.
# Turn them on once the accelerator of the deployment is known to send the data the validation needs.

# Validate the requested account ID against the accounts bound to the consent
consent.account.id.validation.enabled=false
# Validate the account of a funds confirmation request against the account bound to the consent
consent.cof.account.id.validation.enabled=false
# Reject a data access request when the accelerator does not send the data request context
# (headers, resource parameters, client ID and user ID) to the validate-consent-access endpoint
consent.access.context.required=false

# --- Strong Customer Authentication ----------------------------------------------------------------------
#
# The approaches and the methods the deployment supports. An approach or a method is described by the keys
# carrying its identifier, and only the identifiers listed here are read.

sca.approaches=REDIRECT,DECOUPLED
sca.approach.REDIRECT.default=true
# DECOUPLED is not supported by the solution, included for testing purposes
sca.approach.DECOUPLED.default=false

sca.methods=sms-otp,push-otp
sca.method.sms-otp.type=SMS_OTP
sca.method.sms-otp.version=1.0
sca.method.sms-otp.name=SMS OTP on Mobile
sca.method.sms-otp.mapped.approach=REDIRECT
sca.method.sms-otp.description=SMS based one time password
sca.method.sms-otp.default=true
# PUSH_OTP is not supported by the solution, included for testing purposes
sca.method.push-otp.type=PUSH_OTP
sca.method.push-otp.version=1.0
sca.method.push-otp.name=PUSH OTP on Mobile app
sca.method.push-otp.mapped.approach=DECOUPLED
sca.method.push-otp.description=Mobile push notification
sca.method.push-otp.default=false
